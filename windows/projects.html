<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Links Folder</title>
		<link rel="stylesheet" href="/css/global.css" />
	</head>

	<style>
		body {
			color: white;
            width: 100%;
            height: 720px;
            padding: 15px;
		}

		.nav {
			top: 0;
			width: 100%;
			font-size: 1.3em;
			padding: 10px 10px;
            margin: -15px;
            margin-bottom: 15px !important;
			border-bottom: #3e3e3e 1px solid;
		}

		#file-area {
			width: 100%;
			z-index: 1;
            display: flex;
            flex-direction: row;
            gap: 30px;
		}

		.file {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 2;
            cursor: pointer;
            padding: 10px;
			width: fit-content;
			height: fit-content;
            color: white;
            text-decoration: none;
		}

		.file img {
			margin-bottom: 10px;
            border-radius: 8px;
			padding: 0;
			width: 4rem;
			height: auto;
		}

		.file p {
			margin: 0;
			padding: 0;
			font-size: 1.1rem;
		}

		.file:hover {
			background-color: rgba(255, 255, 255, 0.1);
		}
	</style>

	<body>
		<div class="nav">C:\ Users \ Conner \ Portfolio \ <strong>Projects</strong></div>
		<div id="file-area"></div>

		<script>
            let projectsFolder = [
                { name: "unit_3_project" },
                { name: "playlist_project" },
                { name: "rock_paper_scissors" },
            ];

			projectsFolder.forEach((file) => {
                document.querySelector("#file-area").innerHTML += `<div href="${file.link}" id="${file.name}" class="file"><img src="/assets/apps/html.svg"><p>${file.name}.html</p></div>`;
            });

            document.addEventListener("click", (event) => {
                const clicked = event.target.closest(".file");
                if (!clicked) return;

                if (clicked.id === "unit_3_project") {
                    window.open("https://github.com/conguu/nextech-unit-3-project", "_blank");
                } else if (clicked.id === "playlist_project") {
                    window.open("https://github.com/conguu/playlist-project", "_blank");
                } else {
                    window.open("https://github.com/conguu/rock-paper-scissors", "_blank");
                }
            });
		</script>
	    <script src="/js/global.js"></script>
	</body>
</html>
